<svg width="217" height="159" viewBox="0 0 217 159" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated long-eared mascot</title>
  <desc id="desc">A black long-eared mascot with white oval eyes, gentle gaze movement, and a unified blink.</desc>
  <style>
    .idle{transform-box:fill-box;transform-origin:center;animation:float 4.8s cubic-bezier(.37,0,.22,1) infinite}.ears{transform-box:fill-box;transform-origin:center bottom;animation:ears 4.8s cubic-bezier(.37,0,.22,1) infinite}.eyes{transform-box:fill-box;transform-origin:center;animation:blink 6.8s linear infinite}.pupil-left,.pupil-right{transform-box:fill-box;transform-origin:center;animation:gaze 6.8s cubic-bezier(.37,0,.22,1) infinite}.left-tuft{transform-box:fill-box;transform-origin:right center;animation:left-wave 4.8s ease-in-out infinite}.right-tuft{transform-box:fill-box;transform-origin:left center;animation:right-wave 4.8s ease-in-out infinite}
    @keyframes float{0%,100%{translate:0 0}45%{translate:0 -4px}55%{translate:0 -4px}}@keyframes ears{0%,100%{rotate:0deg}34%{rotate:-1.1deg}61%{rotate:1.1deg}}@keyframes blink{0%,31%,34%,72%,75%,100%{scale:1 1}32%,73%{scale:1 .04}}@keyframes gaze{0%,16%,100%{translate:0 0}31%,48%{translate:3px -1px}64%,80%{translate:-3px 1px}}@keyframes left-wave{0%,100%{rotate:0deg}50%{rotate:-4deg}}@keyframes right-wave{0%,100%{rotate:0deg}50%{rotate:4deg}}
    @media (prefers-reduced-motion:reduce){.idle,.ears,.eyes,.pupil-left,.pupil-right,.left-tuft,.right-tuft{animation:none}}
  </style>
