<svg width="138" height="198" viewBox="0 0 138 198" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bunny mascot, happy">
  <style>
    .m-bunny-happy .mascot-body{fill:var(--mascot-body,#ffffff);}
    .m-bunny-happy .eye-white{fill:#fff;}
    .m-bunny-happy .pupil{fill:var(--mascot-ink,#24211f);}
    .m-bunny-happy .ink{fill:var(--mascot-ink,#24211f);stroke:none;}
    .m-bunny-happy .mouth{fill:none;stroke:var(--mascot-ink,#24211f);stroke-linecap:round;}
    .m-bunny-happy .eye-arc{fill:none;stroke:var(--mascot-ink,#24211f);stroke-linecap:round;}
    .m-bunny-happy .mascot-idle{transform-box:fill-box;transform-origin:center;animation:m-bunny-happy-float 4.8s cubic-bezier(.37,0,.22,1) infinite;}
    .m-bunny-happy .pupil{transform-box:fill-box;transform-origin:center;animation:m-bunny-happy-gaze 6.8s cubic-bezier(.37,0,.22,1) infinite;}
    @keyframes m-bunny-happy-float{0%,100%{translate:0 0;}45%,55%{translate:0 -4px;}}
    @keyframes m-bunny-happy-gaze{0%,16%,100%{translate:0 0;}31%,48%{translate:3px -1px;}64%,80%{translate:-3px 1px;}}
    @media (prefers-reduced-motion:reduce){.m-bunny-happy .mascot-idle,.m-bunny-happy .mascot-blink,.m-bunny-happy .pupil,.m-bunny-happy .mascot-travelface{animation:none;}}
  </style>
  <title>Bunny mascot (happy)</title><desc>Animated Bunny mascot, happy expression.</desc>
