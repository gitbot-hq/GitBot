<svg width="154" height="156" viewBox="0 0 154 156" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ghost mascot, spinning">
  <style>
    .m-ghost-spin .mascot-body{fill:var(--mascot-body,#ffffff);}
    .m-ghost-spin .eye-white{fill:#fff;}
    .m-ghost-spin .pupil{fill:var(--mascot-ink,#24211f);}
    .m-ghost-spin .ink{fill:var(--mascot-ink,#24211f);stroke:none;}
    .m-ghost-spin .mouth{fill:none;stroke:var(--mascot-ink,#24211f);stroke-linecap:round;}
    .m-ghost-spin .eye-arc{fill:none;stroke:var(--mascot-ink,#24211f);stroke-linecap:round;}
    .m-ghost-spin .mascot-idle{transform-box:fill-box;transform-origin:center;animation:m-ghost-spin-float 4.8s cubic-bezier(.37,0,.22,1) infinite;}
    .m-ghost-spin .pupil{transform-box:fill-box;transform-origin:center;animation:m-ghost-spin-gaze 6.8s cubic-bezier(.37,0,.22,1) infinite;}
    .m-ghost-spin .mascot-blink{transform-box:fill-box;transform-origin:center;animation:m-ghost-spin-blink 6.8s linear infinite;}
    .m-ghost-spin .mascot-travelface{transform-box:fill-box;transform-origin:center;animation:m-ghost-spin-travel 2.4s linear infinite;}
    @keyframes m-ghost-spin-blink{0%,31%,34%,72%,75%,100%{scale:1 1;}32%,73%{scale:1 .04;}}
    @keyframes m-ghost-spin-gaze{0%,16%,100%{translate:0 0;}31%,48%{translate:3px -1px;}64%,80%{translate:-3px 1px;}}
    @keyframes m-ghost-spin-travel{0%,10%{translate:0px 0px;opacity:1;animation-timing-function:ease-in;}32%{translate:-69px 0px;opacity:0;animation-timing-function:linear;}52%{translate:69px 0px;opacity:0;animation-timing-function:ease-out;}70%{translate:-10px 0px;opacity:1;animation-timing-function:ease-out;}80%,100%{translate:0px 0px;opacity:1;}}
    @media (prefers-reduced-motion:reduce){.m-ghost-spin .mascot-idle,.m-ghost-spin .mascot-blink,.m-ghost-spin .pupil,.m-ghost-spin .mascot-travelface{animation:none;}}
  </style>
  <title>Ghost mascot (spinning)</title><desc>Animated Ghost mascot, face travelling round and back.</desc>
  <g class="m-ghost-spin"><g class="mascot-idle"><g class="mascot-body"><path class="mascot-body" d="M26.2845 34.5792C15.7865 59.7741 10.7906 85.5773 7.87011 103.386C6.61577 111.035 2.13383 117.798 0.419744 125.357C0.155746 126.521 0 127.759 0 129.063C0 133.865 0.10914 146.962 14.7338 146.962C23.8521 146.962 30.69 142.41 34.4519 138.627C35.1766 137.898 36.8435 138.49 36.9412 139.513C37.6103 146.514 41.5608 155.839 54.024 155.693C67.3265 155.537 75.3787 146.475 78.5974 140.487C79.0084 139.722 80.1862 139.691 80.6168 140.445C84.2165 146.748 92.0373 156.167 101.609 155.147C109.06 154.203 115.2 151.038 119.686 139.14C119.943 138.459 120.82 138.246 121.365 138.727C133.745 149.663 148.704 149.751 153.106 137.569C155.845 129.99 150.402 122.372 148.108 114.646C144.203 101.491 149.735 84.6833 139.488 40.6224C126.377 -15.7529 44.5736 -9.31388 26.2845 34.5792Z"/></g><g class="mascot-travelface"><g class="mascot-blink"><g class="mascot-eyes"><g><path class="eye-arc" d="M53 67Q63 54 73 67" stroke-width="6"/></g><g><path class="eye-arc" d="M90 67Q100 54 110 67" stroke-width="6"/></g></g></g></g></g></g>
</svg>
