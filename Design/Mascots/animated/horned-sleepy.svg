<svg width="162" height="153" viewBox="0 0 162 153" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Horned mascot, sleepy">
  <style>
    .m-horned-sleepy .mascot-body{fill:var(--mascot-body,#ffffff);}
    .m-horned-sleepy .eye-white{fill:#fff;}
    .m-horned-sleepy .pupil{fill:var(--mascot-ink,#24211f);}
    .m-horned-sleepy .ink{fill:var(--mascot-ink,#24211f);stroke:none;}
    .m-horned-sleepy .mouth{fill:none;stroke:var(--mascot-ink,#24211f);stroke-linecap:round;}
    .m-horned-sleepy .eye-arc{fill:none;stroke:var(--mascot-ink,#24211f);stroke-linecap:round;}
    .m-horned-sleepy .mascot-idle{transform-box:fill-box;transform-origin:center;animation:m-horned-sleepy-float 4.8s cubic-bezier(.37,0,.22,1) infinite;}
    .m-horned-sleepy .pupil{transform-box:fill-box;transform-origin:center;animation:m-horned-sleepy-gaze 6.8s cubic-bezier(.37,0,.22,1) infinite;}
    @keyframes m-horned-sleepy-float{0%,100%{translate:0 0;}45%,55%{translate:0 -4px;}}
    @keyframes m-horned-sleepy-gaze{0%,16%,100%{translate:0 0;}31%,48%{translate:3px -1px;}64%,80%{translate:-3px 1px;}}
    @media (prefers-reduced-motion:reduce){.m-horned-sleepy .mascot-idle,.m-horned-sleepy .mascot-blink,.m-horned-sleepy .pupil,.m-horned-sleepy .mascot-travelface{animation:none;}}
  </style>
